name: Smart Commute Risk Alert

on:
  # 手動觸發
  workflow_dispatch:
  
  # 自動觸發 (UTC 時間: 週日至週四 23:00 = 台灣時間: 週一至週五 07:00)
  schedule:
    - cron: '0 23 * * 0-4'

jobs:
  run-commute-alert:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行通勤通知腳本
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
